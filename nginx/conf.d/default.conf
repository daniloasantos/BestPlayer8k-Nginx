# Redirecionar HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bestplayer8k.cloud www.bestplayer8k.cloud;

    # Health check interno (usado pelo docker healthcheck, sem redirect)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Renovação de certificados Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bestplayer8k.cloud www.bestplayer8k.cloud;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/bestplayer8k.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestplayer8k.cloud/privkey.pem;

    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Buffer SSL reduzido — melhora handshake em redes móveis (5G/4G)
    # O padrão 16k causa fragmentação em links com MTU menor
    ssl_buffer_size 4k;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ----------------------------------------------------------------
    # Modo de manutenção
    # Ativado via: make maintenance-on
    # Desativado via: make maintenance-off
    # Funciona verificando a existência do arquivo /var/run/nginx-flags/.maintenance
    # ----------------------------------------------------------------
    set $maintenance 0;
    if (-f /var/run/nginx-flags/.maintenance) {
        set $maintenance 1;
    }

    # Página de manutenção (acesso interno apenas)
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /opt/nginx/html;
        internal;
    }

    # Health check interno do nginx (usado pelo docker healthcheck)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy para o backend API
    location /api/ {
        if ($maintenance = 1) { return 503; }

        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy para o frontend (deve vir após /api)
    location / {
        if ($maintenance = 1) { return 503; }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
