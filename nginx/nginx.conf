user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Corrige o header Connection para redes móveis (5G/4G).
    # Sem isso, nginx manda Connection: upgrade em todos os requests,
    # incluindo POST de login — operadoras com proxy transparente
    # tentam tratar como WebSocket e corrompem o request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Buffers maiores para headers de operadoras móveis.
    # Vivo, TIM, Claro injetam headers extras (CGNAT, carrier headers)
    # que ultrapassam o padrão de 4 * 8k.
    large_client_header_buffers 4 16k;

    include /etc/nginx/conf.d/*.conf;
}
